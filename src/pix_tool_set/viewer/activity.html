<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pix-tool-set · 调用活动</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --panel-2: #1c2229;
    --line: #262d36;
    --text: #d6dee8;
    --dim: #8b96a5;
    --faint: #5d6875;
    --ok: #4fb477;
    --warn: #d9a13b;
    --err: #e0574a;
    --accent: #58a6ff;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; letter-spacing: .2px; }
  .brand small { color: var(--faint); font-weight: 400; margin-left: 6px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--dim); font-size: 12px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint); transition: background .2s;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(79,180,119,.18); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(224,87,74,.18); }
  .counts { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--dim); }
  .counts b { color: var(--text); font-weight: 600; }

  .toolbar {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line);
  }
  input[type=search], select {
    background: #0f1419; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 9px; font-size: 12px; font-family: inherit;
  }
  input[type=search] { width: 230px; }
  input[type=search]:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: #222932; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 11px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: #2b333e; border-color: #39424e; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #1f6feb33; border-color: #1f6feb77; color: #a9ccff; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; }

  main { flex: 1; display: flex; min-height: 0; }
  .list-pane { flex: 1.15; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .detail-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #12161b; }

  .rows { flex: 1; overflow-y: auto; }
  .row {
    display: grid; grid-template-columns: 62px 1fr 74px 66px;
    gap: 10px; align-items: baseline;
    padding: 7px 14px; border-bottom: 1px solid #1d232b;
    cursor: pointer; border-left: 3px solid transparent;
  }
  .row:hover { background: #171d24; }
  .row.sel { background: #1b2530; border-left-color: var(--accent); }
  .row.replay-cursor { border-left-color: var(--warn); background: #221f18; }
  .row.fresh { animation: flash 1.1s ease-out; }
  @keyframes flash { from { background: #1d3a2a; } to { background: transparent; } }
  .t { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name .args { color: var(--faint); font-weight: 400; font-size: 11.5px; margin-left: 7px; font-family: var(--mono); }
  .st { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .st.success { color: var(--ok); }
  .st.partial { color: var(--warn); }
  .st.error { color: var(--err); }
  .ms { color: var(--faint); font-family: var(--mono); font-size: 11px; text-align: right; }

  .pane-head {
    flex: none; padding: 9px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; background: var(--panel-2);
  }
  .pane-head h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .4px; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { padding: 3px 10px; border-radius: 4px; font-size: 12px; color: var(--dim); cursor: pointer; border: 1px solid transparent; }
  .tab.on { background: #222b35; color: var(--text); border-color: var(--line); }

  .detail-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .kv { display: grid; grid-template-columns: 116px 1fr; gap: 4px 12px; margin-bottom: 12px; }
  .kv dt { color: var(--faint); font-size: 12px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .cmd {
    background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 11px; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; word-break: break-all; color: #b9d5f5; margin-bottom: 12px;
  }
  h3.sec { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin: 14px 0 6px; }
  pre.json {
    background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 11px; margin: 0; overflow-x: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: #c8d3e0;
  }
  .diag { border-left: 3px solid var(--warn); background: #1e1c15; padding: 7px 10px; border-radius: 0 5px 5px 0; margin-bottom: 6px; font-size: 12px; }
  .diag.error { border-left-color: var(--err); background: #211715; }
  .diag .lvl { color: var(--warn); font-weight: 600; font-size: 11px; text-transform: uppercase; margin-right: 6px; }
  .diag.error .lvl { color: var(--err); }
  .paths li { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  .empty { color: var(--faint); text-align: center; padding: 40px 20px; font-size: 13px; }
  .empty code { background: #0b0e12; padding: 2px 6px; border-radius: 3px; color: #9ec4f0; }

  footer {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 7px 16px; background: var(--panel); border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--faint);
  }
  .bar { flex: 1; height: 4px; background: #222932; border-radius: 2px; overflow: hidden; min-width: 80px; }
  .bar > i { display: block; height: 100%; background: var(--warn); width: 0; transition: width .12s linear; }
  .path { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .rows::-webkit-scrollbar, .detail-body::-webkit-scrollbar, pre.json::-webkit-scrollbar { width: 9px; height: 9px; }
  .rows::-webkit-scrollbar-thumb, .detail-body::-webkit-scrollbar-thumb, pre.json::-webkit-scrollbar-thumb { background: #2c343e; border-radius: 5px; }
</style>
</head>
<body>

<header>
  <span class="brand">pix-tool-set<small>调用活动</small></span>
  <span class="live"><i class="dot" id="dot"></i><span id="liveText">连接中…</span></span>
  <div class="counts">
    <span>共 <b id="cTotal">0</b></span>
    <span style="color:var(--ok)">成功 <b id="cOk">0</b></span>
    <span style="color:var(--warn)">partial <b id="cPart">0</b></span>
    <span style="color:var(--err)">错误 <b id="cErr">0</b></span>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="过滤工具名 / 命令 / 参数…">
  <select id="fStatus">
    <option value="">全部状态</option>
    <option value="success">success</option>
    <option value="partial">partial</option>
    <option value="error">error</option>
  </select>
  <select id="fTool"><option value="">全部工具</option></select>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="follow" checked>自动跟随</label>
  <div class="sep"></div>
  <button id="rPlay">▶ 回放</button>
  <button id="rStep" disabled>下一步</button>
  <button id="rStop" disabled>停止</button>
  <select id="rSpeed">
    <option value="1600">慢速 1.6s</option>
    <option value="800" selected>常速 0.8s</option>
    <option value="300">快速 0.3s</option>
    <option value="0">真实间隔</option>
  </select>
  <div class="sep"></div>
  <button id="btnClearView">清空视图</button>
</div>

<main>
  <section class="list-pane">
    <div class="rows" id="rows">
      <div class="empty" id="emptyList">
        暂无记录。在终端里执行任意命令，例如 <code>pix-tool-set frame-stats</code>，这里会实时出现。
      </div>
    </div>
  </section>

  <section class="detail-pane">
    <div class="pane-head">
      <h2 id="detailTitle">详情</h2>
      <div class="tabs">
        <span class="tab on" data-tab="overview">概览</span>
        <span class="tab" data-tab="data">结果数据</span>
        <span class="tab" data-tab="raw">原始信封</span>
      </div>
    </div>
    <div class="detail-body" id="detail">
      <div class="empty">选择左侧任意一条调用查看详情。</div>
    </div>
  </section>
</main>

<footer>
  <span id="replayState">就绪</span>
  <div class="bar"><i id="replayBar"></i></div>
  <span class="path" id="logPath"></span>
</footer>

<script>
/*__PIX_ACTIVITY_BOOTSTRAP__*/

(function () {
  "use strict";

  const boot = window.__PIX_ACTIVITY_BOOTSTRAP__ || null;
  const STANDALONE = !!(boot && boot.standalone);

  const state = {
    entries: [],
    byId: new Map(),
    offset: 0,
    selected: null,
    tab: "overview",
    payloads: new Map(),
    replay: { on: false, auto: false, at: -1, timer: null, visible: [] },
    firstLoad: true,
  };

  if (STANDALONE && boot.payloads) {
    for (const [id, envelope] of Object.entries(boot.payloads)) {
      state.payloads.set(id, envelope);
    }
  }

  const $ = (id) => document.getElementById(id);
  const rowsEl = $("rows");
  const detailEl = $("detail");

  // ---------------------------------------------------------------- utils
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
    ));
  }

  function clockOf(entry) {
    const seconds = Number(entry.started_at || 0);
    if (!seconds) return "--:--:--";
    const d = new Date(seconds * 1000);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function durationOf(ms) {
    const value = Number(ms || 0);
    if (value < 1000) return value.toFixed(0) + "ms";
    if (value < 60000) return (value / 1000).toFixed(2) + "s";
    return Math.floor(value / 60000) + "m" + Math.round((value % 60000) / 1000) + "s";
  }

  function argGist(entry) {
    const args = entry.args;
    if (!args || typeof args !== "object" || Array.isArray(args)) return "";
    const parts = [];
    for (const [key, value] of Object.entries(args)) {
      if (key === "session" || value === null || value === undefined) continue;
      parts.push(`${key}=${typeof value === "object" ? "…" : value}`);
      if (parts.length >= 3) break;
    }
    return parts.join(" ");
  }

  // ---------------------------------------------------------------- filters
  function visibleEntries() {
    const needle = $("q").value.trim().toLowerCase();
    const wantStatus = $("fStatus").value;
    const wantTool = $("fTool").value;
    return state.entries.filter((entry) => {
      if (wantStatus && entry.status !== wantStatus) return false;
      if (wantTool && entry.tool !== wantTool) return false;
      if (!needle) return true;
      const hay = [entry.tool, entry.command, JSON.stringify(entry.args || {}),
                   (entry.error && entry.error.code) || ""].join(" ").toLowerCase();
      return hay.includes(needle);
    });
  }

  function refreshToolFilter() {
    const select = $("fTool");
    const seen = new Set(state.entries.map((e) => e.tool));
    const current = select.value;
    const names = [...seen].sort();
    if (select.dataset.sig === names.join("|")) return;
    select.dataset.sig = names.join("|");
    select.innerHTML = '<option value="">全部工具</option>' +
      names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    if (seen.has(current)) select.value = current;
  }

  // ---------------------------------------------------------------- list
  function renderList(freshIds) {
    const rows = visibleEntries();
    state.replay.visible = rows;
    $("emptyList") && ($("emptyList").style.display = rows.length ? "none" : "");
    if (!rows.length) {
      rowsEl.innerHTML = `<div class="empty" id="emptyList">${
        state.entries.length
          ? "没有匹配当前过滤条件的调用。"
          : '暂无记录。在终端里执行任意命令，例如 <code>pix-tool-set frame-stats</code>，这里会实时出现。'
      }</div>`;
      return;
    }
    const cursorId = state.replay.on && state.replay.at >= 0
      ? (rows[state.replay.at] || {}).id : null;
    rowsEl.innerHTML = rows.map((entry) => {
      const classes = ["row"];
      if (entry.id === state.selected) classes.push("sel");
      if (entry.id === cursorId) classes.push("replay-cursor");
      if (freshIds && freshIds.has(entry.id)) classes.push("fresh");
      const gist = argGist(entry);
      return `<div class="${classes.join(" ")}" data-id="${esc(entry.id)}">
        <span class="t">${clockOf(entry)}</span>
        <span class="name">${esc(entry.tool)}${gist ? `<span class="args">${esc(gist)}</span>` : ""}</span>
        <span class="st ${esc(entry.status)}">${esc(entry.status)}</span>
        <span class="ms">${durationOf(entry.duration_ms)}</span>
      </div>`;
    }).join("");
  }

  function updateCounts() {
    const tally = { success: 0, partial: 0, error: 0 };
    for (const entry of state.entries) {
      if (tally[entry.status] !== undefined) tally[entry.status] += 1;
    }
    $("cTotal").textContent = state.entries.length;
    $("cOk").textContent = tally.success;
    $("cPart").textContent = tally.partial;
    $("cErr").textContent = tally.error;
  }

  // ---------------------------------------------------------------- detail
  function select(id, opts) {
    state.selected = id;
    renderList();
    renderDetail();
    if (opts && opts.scroll) {
      const node = rowsEl.querySelector(`.row[data-id="${id}"]`);
      if (node) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function renderDetail() {
    const entry = state.byId.get(state.selected);
    if (!entry) {
      detailEl.innerHTML = '<div class="empty">选择左侧任意一条调用查看详情。</div>';
      $("detailTitle").textContent = "详情";
      return;
    }
    $("detailTitle").textContent = entry.tool;

    if (state.tab === "overview") {
      detailEl.innerHTML = overviewHtml(entry);
      return;
    }
    const envelope = state.payloads.get(entry.id);
    if (!envelope) {
      detailEl.innerHTML = '<div class="empty">正在读取完整结果…</div>';
      fetchPayload(entry.id).then(() => {
        if (state.selected === entry.id) renderDetail();
      });
      return;
    }
    const body = state.tab === "data" ? envelope.data : envelope;
    detailEl.innerHTML = `<pre class="json">${esc(JSON.stringify(body, null, 2))}</pre>`;
  }

  function overviewHtml(entry) {
    const started = entry.started_at
      ? new Date(entry.started_at * 1000).toLocaleString() : "-";
    let html = `<div class="cmd">${esc(entry.command || entry.tool)}</div>`;
    html += `<dl class="kv">
      <dt>状态</dt><dd class="st ${esc(entry.status)}">${esc(entry.status)}</dd>
      <dt>耗时</dt><dd>${durationOf(entry.duration_ms)}</dd>
      <dt>发起时间</dt><dd>${esc(started)}</dd>
      <dt>入口</dt><dd>${esc(entry.entry || "-")}</dd>
      <dt>会话</dt><dd>${esc(entry.session || "(默认)")}</dd>
      <dt>记录 id</dt><dd>${esc(entry.id)}</dd>
      <dt>工作目录</dt><dd>${esc(entry.cwd || "-")}</dd>
    </dl>`;

    if (entry.error) {
      html += `<div class="diag error"><span class="lvl">${esc(entry.error.code || "error")}</span>${
        esc(entry.error.message || "")}</div>`;
    }
    for (const d of entry.diagnostics || []) {
      html += `<div class="diag ${d.level === "error" ? "error" : ""}"><span class="lvl">${
        esc(d.level || "info")}</span>${esc(d.message || "")}</div>`;
    }
    if (entry.args && Object.keys(entry.args).length) {
      html += `<h3 class="sec">参数</h3><pre class="json">${
        esc(JSON.stringify(entry.args, null, 2))}</pre>`;
    }
    if (entry.summary !== null && entry.summary !== undefined) {
      html += `<h3 class="sec">结果摘要 <span style="text-transform:none;letter-spacing:0;color:#4a5460">`
        + `（已折叠，<code style="color:#7d8794">&lt;list: n&gt;</code> / `
        + `<code style="color:#7d8794">&lt;dict: n keys&gt;</code> 为占位；完整值见「结果数据」）</span></h3>`
        + `<pre class="json">${esc(JSON.stringify(entry.summary, null, 2))}</pre>`;
    }
    if ((entry.output_paths || []).length) {
      html += `<h3 class="sec">产出文件</h3><ul class="paths">${
        entry.output_paths.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`;
    }
    return html;
  }

  async function fetchPayload(id) {
    if (state.payloads.has(id)) return state.payloads.get(id);
    if (STANDALONE) return null;
    try {
      const response = await fetch(`api/payload?id=${encodeURIComponent(id)}`);
      if (!response.ok) return null;
      const body = await response.json();
      state.payloads.set(id, body.envelope);
      return body.envelope;
    } catch (_) {
      return null;
    }
  }

  // ---------------------------------------------------------------- replay
  function replayStop() {
    state.replay.on = false;
    state.replay.auto = false;
    if (state.replay.timer) { clearTimeout(state.replay.timer); state.replay.timer = null; }
    $("rPlay").disabled = false;
    $("rStep").disabled = true;
    $("rStop").disabled = true;
    $("replayState").textContent = "就绪";
    $("replayBar").style.width = "0";
    renderList();
  }

  function replayStart() {
    const rows = visibleEntries();
    if (!rows.length) return;
    state.replay.on = true;
    state.replay.auto = true;
    state.replay.at = -1;
    state.replay.visible = rows;
    $("follow").checked = false;
    $("rPlay").disabled = true;
    $("rStep").disabled = false;
    $("rStop").disabled = false;
    replayAdvance();
  }

  function replayAdvance() {
    const rows = state.replay.visible.length ? state.replay.visible : visibleEntries();
    state.replay.at += 1;
    if (state.replay.at >= rows.length) {
      $("replayState").textContent = `回放结束（共 ${rows.length} 步）`;
      $("replayBar").style.width = "100%";
      state.replay.on = false;
      state.replay.auto = false;
      $("rPlay").disabled = false;
      $("rStep").disabled = true;
      renderList();
      return;
    }
    const entry = rows[state.replay.at];
    select(entry.id, { scroll: true });
    $("replayState").textContent =
      `回放 ${state.replay.at + 1}/${rows.length} · ${entry.tool}`;
    $("replayBar").style.width = ((state.replay.at + 1) / rows.length * 100) + "%";

    if (!state.replay.auto) return;
    const mode = Number($("rSpeed").value);
    let delay = mode;
    if (mode === 0) {
      // Real spacing: the gap the user actually left between the two calls, clamped so
      // an idle hour does not stall the replay.
      const next = rows[state.replay.at + 1];
      const gap = next ? (Number(next.started_at) - Number(entry.started_at)) * 1000 : 600;
      delay = Math.max(200, Math.min(gap || 600, 5000));
    }
    state.replay.timer = setTimeout(replayAdvance, delay);
  }

  function replayStep() {
    // Stepping pauses automatic advance rather than fighting it, so the pending timer
    // cannot fire on top of a manual step.
    if (state.replay.timer) { clearTimeout(state.replay.timer); state.replay.timer = null; }
    state.replay.auto = false;
    if (!state.replay.on) {
      state.replay.on = true;
      state.replay.at = -1;
      state.replay.visible = visibleEntries();
      $("follow").checked = false;
      $("rStop").disabled = false;
      $("rPlay").disabled = true;
    }
    replayAdvance();
  }

  // ---------------------------------------------------------------- ingest
  function ingest(entries) {
    const fresh = new Set();
    for (const entry of entries) {
      if (!entry || !entry.id || state.byId.has(entry.id)) continue;
      state.byId.set(entry.id, entry);
      state.entries.push(entry);
      fresh.add(entry.id);
    }
    if (!fresh.size) return;
    refreshToolFilter();
    updateCounts();
    renderList(fresh);
    if ($("follow").checked && !state.replay.on) {
      const rows = visibleEntries();
      const last = rows[rows.length - 1];
      if (last) select(last.id, { scroll: true });
    }
    if (state.firstLoad) {
      state.firstLoad = false;
      const rows = visibleEntries();
      if (rows.length && !state.selected) select(rows[rows.length - 1].id, { scroll: true });
    }
  }

  function setLive(ok, text) {
    const dot = $("dot");
    dot.className = "dot " + (ok ? "on" : "err");
    $("liveText").textContent = text;
  }

  async function poll() {
    try {
      const response = await fetch(`api/feed?offset=${state.offset}`);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const body = await response.json();
      state.offset = body.offset || 0;
      ingest(body.entries || []);
      $("logPath").textContent = body.log_path || "";
      $("logPath").title = body.log_path || "";
      setLive(true, body.recording_enabled ? "实时跟随中" : "记录已被禁用");
    } catch (err) {
      setLive(false, "连接中断，重试中…");
    } finally {
      setTimeout(poll, 700);
    }
  }

  // ---------------------------------------------------------------- wiring
  rowsEl.addEventListener("click", (event) => {
    const row = event.target.closest(".row");
    if (row) select(row.dataset.id);
  });

  for (const tab of document.querySelectorAll(".tab")) {
    tab.addEventListener("click", () => {
      for (const other of document.querySelectorAll(".tab")) other.classList.remove("on");
      tab.classList.add("on");
      state.tab = tab.dataset.tab;
      renderDetail();
    });
  }

  $("q").addEventListener("input", () => renderList());
  $("fStatus").addEventListener("change", () => renderList());
  $("fTool").addEventListener("change", () => renderList());
  $("rPlay").addEventListener("click", replayStart);
  $("rStep").addEventListener("click", replayStep);
  $("rStop").addEventListener("click", replayStop);
  $("btnClearView").addEventListener("click", () => {
    state.entries = []; state.byId.clear(); state.selected = null;
    state.offset = 0; state.firstLoad = true;
    updateCounts(); renderList(); renderDetail();
  });

  document.addEventListener("keydown", (event) => {
    if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT") return;
    const rows = visibleEntries();
    const at = rows.findIndex((r) => r.id === state.selected);
    if (event.key === "j" || event.key === "ArrowDown") {
      if (at + 1 < rows.length) { select(rows[at + 1].id, { scroll: true }); event.preventDefault(); }
    } else if (event.key === "k" || event.key === "ArrowUp") {
      if (at > 0) { select(rows[at - 1].id, { scroll: true }); event.preventDefault(); }
    } else if (event.key === " ") {
      state.replay.on ? replayStop() : replayStart(); event.preventDefault();
    }
  });

  // ---------------------------------------------------------------- boot
  if (STANDALONE) {
    ingest(boot.entries || []);
    $("logPath").textContent = (boot.stats && boot.stats.log_path) || "(离线快照)";
    setLive(false, `离线快照 · ${(boot.entries || []).length} 条`);
    $("dot").className = "dot";
  } else {
    poll();
  }
})();
</script>
</body>
</html>
